<!DOCTYPE html>
<html>
    <body>
        <div id="root"></div>
    </body>
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // step6 : Final, divide and conquer
        function MinutesToHours() {
            const [amount, setAmount] = React.useState();
            const [flipped, setFlipped] = React.useState(false); //true or false인 변수값을 저장
            const onChange = (event) => {
                setAmount(event.target.value);
            };
            const reset = () => setAmount(0);
            const onFlip = () => setFlipped((current) => !current); //flipped이 false면 true 값을 return하고 true면 false값을 return
            return (
                <div>
                    <div>
                        <label htmlFor="minutes">Minutes</label>
                        <input 
                            value={flipped ? amount * 60 : amount} 
                            id="minutes" 
                            placeholder="Minutes" 
                            type="number" 
                            onChange={onChange}
                            disabled={flipped === true} //javascript의 조건문을 여기서 쓸 수 있음
                        />
                    </div>
                    <div>
                        <label htmlFor="hours">Hours</label>
                        <input 
                            value={flipped ? amount : Math.round(amount / 60)} //문제점 : input이 enabled가 돼서 값을 입력하면 해당 input에 무엇을 입력하던 값은 0으로 출력되고 Minutes에 변환된 값이 출력된다. 따라서 삼항연산자로 flipped 상태가 true라면 단위변환을 보여주지 않음
                            id="hours"
                            placeholder="Hours" 
                            type="number" 
                            onChange={onChange}
                            disabled={!flipped} //javascript의 조건문을 여기서 쓸 수 있음
                        />    
                    </div>
                    <button onClick={reset}>Reset</button>
                    <button onClick={onFlip}>{flipped ? "Turn back" : "flip"}</button>
                </div>
            );
        }
        function KmToMiles() {
            return <h3>KM To M</h3>
        }
        function App() {
            const [index, setIndex] = React.useState("x");
            const onSelect = (event) => {
                setIndex(event.target.value);
            }
            console.log("render w/", index);
            return (
                <div>
                    <h1 className="hi">Super Converter</h1>
                    {/* 컴포넌트는 그 안에 또 다른 컴포넌트를 렌더링 할 수 있다 */}
                    <select value={index} onChange={onSelect}>
                        <option value="x">Select your units</option>
                        <option value="0">Minutes & hours</option>
                        <option value="1">Km & Miles</option>
                    </select>
                    <hr />
                    {/* 중괄호 안에는 JavaScript를 쓸 수 있다 안그러면 그냥 텍스트로 인식함*/}
                    {index === "x" ? "Please select your units" : null}
                    {index === "0" ? <MinutesToHours /> : null}
                    {index === "1" ? <KmToMiles /> : null}
                </div>
            );
        }


        const root = document.getElementById("root");
        ReactDOM.render(<App />, root);
    </script>
</html>
